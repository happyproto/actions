name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck -x setup-hpy/*.sh plugin-publish/*.sh lexicon-publish/*.sh release-publish/*.sh test/*.sh
      - name: Unit tests
        run: for t in test/*.test.sh; do echo "== $t"; bash "$t" || exit 1; done

  setup-hpy:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [depot-ubuntu-24.04, depot-macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Latest on the beta channel
        id: latest
        uses: ./setup-hpy
        with:
          channel: beta
      - name: hpy is on PATH for later steps
        env:
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          case "$VERSION" in *-beta.*) ;; *) echo "::error::not a beta: $VERSION"; exit 1 ;; esac
          test "$(hpy --version)" = "hpy $VERSION"

      - name: An exact version
        id: exact
        uses: ./setup-hpy
        with:
          version: v1.0.0-alpha.2
      - run: test "$(hpy --version)" = "hpy 1.0.0-alpha.2"

      - name: A malformed credential fails
        id: bad-credential
        continue-on-error: true
        uses: ./setup-hpy
        with:
          version: 1.0.0-alpha.2
          credential: not-a-credential
      # It failed at the credential, not before: hpy was installed.
      - run: |
          test "${{ steps.bad-credential.outcome }}" = failure
          test "$(hpy --version)" = "hpy 1.0.0-alpha.2"

  # An Alpine job container: hpy's musl build. TypeScript releases need
  # libstdc++, which setup-hpy adds as root with apk.
  setup-hpy-alpine:
    needs: test
    runs-on: depot-ubuntu-24.04
    container: alpine:3.22
    steps:
      - run: apk add --no-cache bash curl jq git
      - uses: actions/checkout@v4
      - name: Latest on the beta channel
        id: latest
        uses: ./setup-hpy
        with:
          channel: beta
      - shell: bash
        env:
          VERSION: ${{ steps.latest.outputs.version }}
        run: test "$(hpy --version)" = "hpy $VERSION"

  # `source: npm`, on Linux and Windows. The npm package `hpy` starts with the
  # TypeScript hpy; until it has a release on the beta channel this checks
  # nothing and says so.
  setup-hpy-npm:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [depot-ubuntu-24.04, depot-windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Is hpy on npm yet?
        id: npm
        shell: bash
        run: |
          if v=$(npm view hpy@beta version 2>/dev/null) && [ -n "$v" ]; then
            echo "version=$v" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::hpy has no beta on npm yet; skipping the npm source"
          fi
      - name: An exact version from npm
        if: steps.npm.outputs.version != ''
        id: exact
        uses: ./setup-hpy
        with:
          version: ${{ steps.npm.outputs.version }}
          source: npm
      - if: steps.npm.outputs.version != ''
        shell: bash
        env:
          VERSION: ${{ steps.npm.outputs.version }}
        run: test "$(hpy --version)" = "hpy $VERSION"

  plugin-publish:
    needs: test
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # No real credential here: a bad one must stop the action before it
      # reaches the registry. Real publishes happen in happyproto/plugins.
      - name: A malformed credential stops before publishing
        id: publish
        continue-on-error: true
        uses: ./plugin-publish
        with:
          version: 0.0.1
          credential: not-a-credential
          dry-run: true
          hpy-version: 1.0.0-alpha.2
      # It failed at the credential, not before: the setup script was found
      # by its path from plugin-publish and installed hpy.
      - run: |
          test "${{ steps.publish.outcome }}" = failure
          test "$(hpy --version)" = "hpy 1.0.0-alpha.2"

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  lexicon-publish:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [depot-ubuntu-24.04, depot-macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # example.com has no _lexicon records, so the DNS check must stop the
      # action, naming the record to add, before anything is published.
      - name: Missing DNS stops the action before publishing
        id: dry-run
        continue-on-error: true
        uses: ./lexicon-publish
        with:
          identifier: bsky.app
          lexicons-dir: test/fixtures/lexicons
          dry-run: true
      # It failed at DNS, not before: goat was installed from the release.
      - run: |
          test "${{ steps.dry-run.outcome }}" = failure
          goat --version | grep -q "0.2.6"

  release-publish:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [depot-ubuntu-24.04, depot-macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # A dry run only reads public records and never signs in. bsky.app has
      # no software.release records, so every one is planned as a create.
      - name: A dry run plans every record from public reads
        id: dry-run
        uses: ./release-publish
        with:
          identifier: bsky.app
          publisher-did: did:plc:z72i7hdynmk6r22z27h6tvur
          project: release-publish-ci
          version: 0.0.1-alpha.1
          repository: https://github.com/happyproto/actions.git
          commit: 0123456789abcdef0123456789abcdef01234567
          published-at: 2026-01-01T00:00:00Z
          channels: v0-alpha
      - env:
          URI: ${{ steps.dry-run.outputs.version-uri }}
          PUBLISHED: ${{ steps.dry-run.outputs.published }}
        run: |
          test "$PUBLISHED" = false
          case "$URI" in at://did:plc:*/software.release.version/release-publish-ci.0.0.1-alpha.1) ;; *) echo "::error::version-uri is $URI"; exit 1 ;; esac
      - name: A batch dry run plans every release
        run: |
          cat > "$RUNNER_TEMP/releases.json" <<'JSON'
          [
            {"version": "0.0.1", "repository": "https://github.com/happyproto/actions.git",
             "commit": "0123456789abcdef0123456789abcdef01234567", "published-at": "2026-01-01T00:00:00Z"},
            {"version": "0.0.2", "repository": "https://github.com/happyproto/actions.git",
             "commit": "0123456789abcdef0123456789abcdef01234567", "published-at": "2026-01-02T00:00:00Z",
             "channels": ["v0"]}
          ]
          JSON
          echo "RELEASES_FILE=$RUNNER_TEMP/releases.json" >> "$GITHUB_ENV"
      - id: batch
        uses: ./release-publish
        with:
          identifier: bsky.app
          publisher-did: did:plc:z72i7hdynmk6r22z27h6tvur
          project: release-publish-ci
          releases: ${{ env.RELEASES_FILE }}
      - env:
          URI: ${{ steps.batch.outputs.version-uri }}
          WRITTEN: ${{ steps.batch.outputs.count-written }}
          PUBLISHED: ${{ steps.batch.outputs.published }}
        run: |
          test "$PUBLISHED" = false
          test "$WRITTEN" = 0
          case "$URI" in */software.release.version/release-publish-ci.0.0.2) ;; *) echo "::error::version-uri is $URI"; exit 1 ;; esac
      - name: A publisher mismatch stops the action
        id: mismatch
        continue-on-error: true
        uses: ./release-publish
        with:
          identifier: bsky.app
          publisher-did: did:plc:notthepublisher
          project: release-publish-ci
          version: 0.0.1
          repository: https://github.com/happyproto/actions.git
          commit: 0123456789abcdef0123456789abcdef01234567
          published-at: 2026-01-01T00:00:00Z
      - run: test "${{ steps.mismatch.outcome }}" = failure

  release:
    needs: [test, setup-hpy, plugin-publish, lexicon-publish, release-publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
      # Consumers pin the major version, e.g. @v1.
      - name: Move the major version tag
        if: steps.release.outputs.new-release-published == 'true'
        env:
          VERSION: ${{ steps.release.outputs.new-release-version }}
        run: |
          major="v${VERSION%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "$major" -m "$major is v$VERSION"
          git push --force origin "$major"
